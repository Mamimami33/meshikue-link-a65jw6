<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピリンク集</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --sub:#666; --line:#ddd; --card:#f7f7f7; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#eee; --sub:#9aa0a6; --line:#33363d; --card:#1f2229; --accent:#6ea8fe; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding: 1rem 1rem .5rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
  header h1 { font-size:1.25rem; margin:0; }
  header .updated { color:var(--sub); font-size:.8rem; }
  button, input, select { font: inherit; }
  #refresh { min-height:2.75rem; padding:.5rem 1rem; border:1px solid var(--line); border-radius:.5rem; background:var(--card); color:var(--fg); cursor:pointer; }
  .toolbar { position:sticky; top:0; background:var(--bg); padding:.5rem 1rem; border-bottom:1px solid var(--line); z-index:10; }
  .toolbar .row { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
  #search { flex:1 1 12rem; min-height:2.75rem; padding:.5rem .75rem; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); color:var(--fg); }
  #sort { min-height:2.75rem; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); color:var(--fg); }
  .chips { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.5rem; }
  .chip { min-height:2.75rem; padding:.4rem .8rem; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .count { color:var(--sub); font-size:.85rem; margin-left:auto; }
  main { padding:1rem; display:grid; grid-template-columns:repeat(auto-fill, minmax(16rem, 1fr)); gap:1rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:.75rem; overflow:hidden; }
  .card a { color:inherit; text-decoration:none; display:block; }
  .card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#0002; }
  .card .body { padding:.6rem .75rem .75rem; }
  .card .title { font-weight:600; line-height:1.4; }
  .card .meta { color:var(--sub); font-size:.8rem; margin-top:.25rem; }
  .card .tags { display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.5rem; }
  .card .tags button { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:999px; padding:.15rem .6rem; min-height:2rem; cursor:pointer; font-size:.8rem; }
  .empty, .error { padding:2rem 1rem; text-align:center; color:var(--sub); }
</style>
</head>
<body>
<header>
  <h1>レシピリンク集</h1>
  <button id="refresh" type="button">更新</button>
  <span class="updated" id="updated"></span>
</header>
<div class="toolbar">
  <div class="row">
    <input id="search" type="search" placeholder="検索（料理名・材料・タグ）" aria-label="検索">
    <select id="sort" aria-label="並び順">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="title">タイトル順</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="tagchips"></div>
</div>
<main id="grid"></main>
<div class="empty" id="msg" hidden></div>
<script>
const ALIASES = { "鶏肉":["チキン"], "豚肉":["豚バラ","ポーク"], "うどん":["饂飩"], "ホットドッグ":["ホットドック"] };
let items = [], activeTag = null;

function searchable(it) {
  let s = [it.title, it.channel, ...(it.tags||[])].join(" ").toLowerCase();
  for (const t of (it.tags||[])) for (const a of (ALIASES[t]||[])) s += " " + a.toLowerCase();
  return s;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let list = items.filter(it => {
    if (activeTag && !(it.tags||[]).includes(activeTag)) return false;
    const s = searchable(it);
    return words.every(w => s.includes(w));
  });
  const sort = document.getElementById("sort").value;
  list.sort((a,b) => sort==="old" ? a.posted_at.localeCompare(b.posted_at)
                 : sort==="title" ? a.title.localeCompare(b.title, "ja")
                 : b.posted_at.localeCompare(a.posted_at));
  document.getElementById("count").textContent = `${list.length}件`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const it of list) {
    const card = document.createElement("article");
    card.className = "card";
    const tags = (it.tags||[]).map(t => `<button type="button" data-tag="${t}">${t}</button>`).join("");
    card.innerHTML = `
      <a href="${it.url}" target="_blank" rel="noopener">
        ${it.thumbnail ? `<img src="${it.thumbnail}" alt="" loading="lazy">` : ""}
        <div class="body">
          <div class="title"></div>
          <div class="meta">${it.channel || ""} ・ ${fmtDate(it.posted_at)}</div>
          <div class="tags">${tags}</div>
        </div>
      </a>`;
    card.querySelector(".title").textContent = it.title;
    card.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", e => {
      e.preventDefault();
      setTag(activeTag === b.dataset.tag ? null : b.dataset.tag);
    }));
    grid.appendChild(card);
  }
  const msg = document.getElementById("msg");
  msg.hidden = list.length > 0;
  if (!list.length) msg.textContent = "見つかりませんでした。";
  renderChips();
}
function renderChips() {
  const counts = {};
  for (const it of items) for (const t of (it.tags||[])) counts[t] = (counts[t]||0)+1;
  const box = document.getElementById("tagchips");
  box.innerHTML = "";
  for (const t of Object.keys(counts).sort((a,b)=>counts[b]-counts[a])) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = t;
    b.setAttribute("aria-pressed", activeTag === t ? "true" : "false");
    b.addEventListener("click", () => setTag(activeTag === t ? null : t));
    box.appendChild(b);
  }
}
function setTag(t) { activeTag = t; render(); }
async function load() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "更新中…";
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    items = await r.json();
    document.getElementById("updated").textContent = "最終確認 " + new Date().toLocaleTimeString("ja-JP");
    render();
  } catch (e) {
    const msg = document.getElementById("msg");
    msg.hidden = false; msg.textContent = "データを読み込めませんでした。少し待ってから更新してください。";
  } finally {
    btn.disabled = false; btn.textContent = "更新";
  }
}
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
load();
</script>
</body>
</html>
