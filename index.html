<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レシピリンク集</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="レシピ集">
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --sub:#666; --line:#ddd; --card:#f7f7f7; --accent:#2563eb; --star:#f59e0b; --new:#dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181d; --fg:#eee; --sub:#9aa0a6; --line:#33363d; --card:#1f2229; --accent:#6ea8fe; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:.7rem .8rem .4rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  header h1 { font-size:1.15rem; margin:0; }
  header .updated { color:var(--sub); font-size:.78rem; }
  button, input, select { font: inherit; }
  .hbtn { min-height:2.5rem; padding:.4rem .8rem; border:1px solid var(--line); border-radius:.5rem; background:var(--card); color:var(--fg); cursor:pointer; }
  .toolbar { position:sticky; top:0; background:var(--bg); padding:.45rem .8rem; border-bottom:1px solid var(--line); z-index:10; }
  .toolbar .row { display:flex; gap:.45rem; flex-wrap:wrap; align-items:center; }
  #search { flex:1 1 10rem; min-height:2.5rem; padding:.45rem .7rem; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); color:var(--fg); }
  #sort { min-height:2.5rem; border:1px solid var(--line); border-radius:.5rem; background:var(--bg); color:var(--fg); }
  #favonly { min-height:2.5rem; padding:.4rem .7rem; border:1px solid var(--line); border-radius:.5rem; background:var(--card); color:var(--fg); cursor:pointer; }
  #favonly[aria-pressed="true"] { color:var(--star); border-color:var(--star); }
  .chips { display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.45rem; }
  .chip { min-height:2.3rem; padding:.3rem .7rem; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--fg); cursor:pointer; font-size:.85rem; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .count { color:var(--sub); font-size:.82rem; margin-left:auto; }
  main { padding:.6rem; display:grid; grid-template-columns:repeat(2, 1fr); gap:.6rem; }
  @media (min-width: 48rem) {
    main { grid-template-columns:repeat(auto-fill, minmax(12.5rem, 1fr)); padding:1rem; gap:1rem; }
  }
  .card { position:relative; background:var(--card); border:1px solid var(--line); border-radius:.65rem; overflow:hidden; }
  .card a { color:inherit; text-decoration:none; display:block; }
  .card img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:#0002; }
  .newbadge { position:absolute; top:.35rem; left:.35rem; background:var(--new); color:#fff; font-size:.62rem; font-weight:700; padding:.08rem .38rem; border-radius:.3rem; z-index:2; }
  .card .body { padding:.4rem .5rem .5rem; }
  .card .title { font-weight:600; font-size:.86rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { color:var(--sub); font-size:.66rem; margin-top:.12rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .tags { display:flex; gap:.22rem; flex-wrap:wrap; margin-top:.3rem; max-height:1.55rem; overflow:hidden; }
  .card .tags button { border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:999px; padding:.02rem .42rem; min-height:1.45rem; cursor:pointer; font-size:.66rem; }
  .card .stats { display:flex; align-items:center; gap:.55rem; margin-top:.35rem; font-size:.7rem; color:var(--sub); }
  .favbtn { margin-left:auto; border:1px solid var(--line); background:var(--bg); color:var(--sub); border-radius:999px; padding:.05rem .5rem; min-height:1.6rem; cursor:pointer; font-size:.72rem; }
  .favbtn.on { color:var(--star); border-color:var(--star); }
  #spotlight { padding:.6rem .6rem 0; }
  #spotlight .card { max-width:24rem; margin:0 auto; }
  #spotlight .controls { display:flex; gap:.5rem; justify-content:center; margin-top:.5rem; }
  .empty, .error { padding:2rem 1rem; text-align:center; color:var(--sub); }
</style>
</head>
<body>
<header>
  <h1>レシピリンク集</h1>
  <button id="refresh" class="hbtn" type="button">更新</button>
  <button id="gacha" class="hbtn" type="button">今日のごはん</button>
  <span class="updated" id="updated"></span>
</header>
<div class="toolbar">
  <div class="row">
    <input id="search" type="search" placeholder="検索（料理名・材料・タグ）" aria-label="検索">
    <select id="sort" aria-label="並び順">
      <option value="new">新しい順</option>
      <option value="old">古い順</option>
      <option value="title">タイトル順</option>
    </select>
    <button id="favonly" type="button" aria-pressed="false">★ お気に入り</button>
    <span class="count" id="count"></span>
  </div>
  <div class="chips" id="tagchips"></div>
</div>
<section id="spotlight" hidden></section>
<main id="grid"></main>
<div class="empty" id="msg" hidden></div>
<script>
const ALIASES = { "鶏肉":["チキン"], "豚肉":["豚バラ","ポーク"], "うどん":["饂飩"], "ホットドッグ":["ホットドック"] };
const WORKER_BASE = "https://meshikue-link-a65jw6.stmamiya.workers.dev";
const UPDATE_URL = WORKER_BASE + "/update";
let items = [], counts = {}, activeTag = null, chipsExpanded = false, favOnly = false;
const CHIP_LIMIT = 8;
let myFavs = new Set(JSON.parse(localStorage.getItem("recipe-favs") || "[]"));

function saveFavs() { localStorage.setItem("recipe-favs", JSON.stringify([...myFavs])); }
function searchable(it) {
  let s = [it.title, it.channel, ...(it.tags||[])].join(" ").toLowerCase();
  for (const t of (it.tags||[])) for (const a of (ALIASES[t]||[])) s += " " + a.toLowerCase();
  return s;
}
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}
function isNew(it) {
  const d = new Date(it.posted_at);
  return !isNaN(d) && (Date.now() - d.getTime()) < 7 * 24 * 60 * 60 * 1000;
}
function makeCard(it) {
  const c = counts[it.url] || { views: 0, favs: 0 };
  const card = document.createElement("article");
  card.className = "card";
  const tags = (it.tags||[]).map(t => `<button type="button" data-tag="${t}">${t}</button>`).join("");
  card.innerHTML = `
    <a href="${it.url}" target="_blank" rel="noopener">
      ${isNew(it) ? `<span class="newbadge">NEW</span>` : ""}
      ${it.thumbnail ? `<img src="${it.thumbnail}" alt="" loading="lazy">` : ""}
      <div class="body">
        <div class="title"></div>
        <div class="meta">${it.channel || ""} ・ ${fmtDate(it.posted_at)}</div>
        <div class="tags">${tags}</div>
        <div class="stats">
          <span>👁 ${c.views}</span>
          <span>★ ${c.favs}</span>
          <button type="button" class="favbtn${myFavs.has(it.url) ? " on" : ""}" data-fav="${it.url}">${myFavs.has(it.url) ? "★ お気に入り" : "☆ お気に入り"}</button>
        </div>
      </div>
    </a>`;
  card.querySelector(".title").textContent = it.title;
  card.querySelector("a").addEventListener("click", (e) => {
    if (e.target.closest("button")) return;
    countView(it.url);
  });
  card.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", e => {
    e.preventDefault();
    setTag(activeTag === b.dataset.tag ? null : b.dataset.tag);
  }));
  card.querySelector("[data-fav]").addEventListener("click", e => {
    e.preventDefault();
    toggleFav(it.url);
  });
  return card;
}
async function countView(url) {
  try {
    const r = await fetch(WORKER_BASE + "/view", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    const j = await r.json();
    if (j.ok) counts[url] = { views: j.views, favs: j.favs };
  } catch (e) { /* 数えられなくても遷移は妨げない */ }
}
async function toggleFav(url) {
  const delta = myFavs.has(url) ? -1 : 1;
  if (delta === 1) myFavs.add(url); else myFavs.delete(url);
  saveFavs();
  try {
    const r = await fetch(WORKER_BASE + "/fav", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url, delta }) });
    const j = await r.json();
    if (j.ok) counts[url] = { views: j.views, favs: j.favs };
  } catch (e) { /* 端末側の状態は保持する */ }
  render();
}
function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  let list = items.filter(it => {
    if (favOnly && !myFavs.has(it.url)) return false;
    if (activeTag && !(it.tags||[]).includes(activeTag)) return false;
    const s = searchable(it);
    return words.every(w => s.includes(w));
  });
  const sort = document.getElementById("sort").value;
  list.sort((a,b) => sort==="old" ? a.posted_at.localeCompare(b.posted_at)
                 : sort==="title" ? a.title.localeCompare(b.title, "ja")
                 : b.posted_at.localeCompare(a.posted_at));
  document.getElementById("count").textContent = `${list.length}件`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const it of list) grid.appendChild(makeCard(it));
  const msg = document.getElementById("msg");
  msg.hidden = list.length > 0;
  if (!list.length) msg.textContent = "見つかりませんでした。";
  renderChips();
}
function renderChips() {
  const cnt = {};
  for (const it of items) for (const t of (it.tags||[])) cnt[t] = (cnt[t]||0)+1;
  const box = document.getElementById("tagchips");
  box.innerHTML = "";
  const all = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const shown = chipsExpanded ? all : all.slice(0, CHIP_LIMIT);
  if (activeTag && !shown.includes(activeTag) && all.includes(activeTag)) shown.unshift(activeTag);
  for (const t of shown) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = t;
    b.setAttribute("aria-pressed", activeTag === t ? "true" : "false");
    b.addEventListener("click", () => setTag(activeTag === t ? null : t));
    box.appendChild(b);
  }
  if (all.length > CHIP_LIMIT) {
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button";
    b.textContent = chipsExpanded ? "閉じる" : `もっと見る（${all.length - CHIP_LIMIT}）`;
    b.addEventListener("click", () => { chipsExpanded = !chipsExpanded; renderChips(); });
    box.appendChild(b);
  }
}
function setTag(t) { activeTag = t; render(); }
async function loadCounts() {
  try {
    const r = await fetch(WORKER_BASE + "/counts", { cache: "no-store" });
    if (r.ok) { counts = await r.json(); render(); }
  } catch (e) { /* 件数表示なしで続行 */ }
}
async function loadData() {
  const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error(r.status);
  items = await r.json();
  document.getElementById("updated").textContent = "最終確認 " + new Date().toLocaleTimeString("ja-JP");
  render();
}
async function load() {
  try { await loadData(); }
  catch (e) {
    const msg = document.getElementById("msg");
    msg.hidden = false; msg.textContent = "データを読み込めませんでした。少し待ってから更新してください。";
  }
  loadCounts();
}
// 更新ボタン：Discordへ取りに行ってから、最新データを表示する
async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "取得中…";
  const before = new Set(items.map(it => it.url));
  let failed = false;
  try {
    const r = await fetch(UPDATE_URL, { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) failed = true;
  } catch (e) { failed = true; }
  try { await loadData(); }
  catch (e) {
    const msg = document.getElementById("msg");
    msg.hidden = false; msg.textContent = "データを読み込めませんでした。少し待ってから更新してください。";
  }
  if (failed) {
    document.getElementById("updated").textContent = "取得に失敗しました（前回のデータを表示中）";
  } else {
    const added = items.filter(it => !before.has(it.url)).length;
    if (added > 0) document.getElementById("updated").textContent = `新着${added}件`;
  }
  loadCounts();
  btn.disabled = false; btn.textContent = "更新";
}
// 今日のごはん：ランダムで1件出す
function gacha() {
  if (!items.length) return;
  const spot = document.getElementById("spotlight");
  const pick = items[Math.floor(Math.random() * items.length)];
  spot.innerHTML = "";
  spot.appendChild(makeCard(pick));
  const controls = document.createElement("div");
  controls.className = "controls";
  const again = document.createElement("button");
  again.className = "hbtn"; again.type = "button"; again.textContent = "もう一回";
  again.addEventListener("click", gacha);
  const close = document.createElement("button");
  close.className = "hbtn"; close.type = "button"; close.textContent = "閉じる";
  close.addEventListener("click", () => { spot.hidden = true; spot.innerHTML = ""; });
  controls.appendChild(again); controls.appendChild(close);
  spot.appendChild(controls);
  spot.hidden = false;
  spot.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.getElementById("refresh").addEventListener("click", refresh);
document.getElementById("gacha").addEventListener("click", gacha);
document.getElementById("favonly").addEventListener("click", (e) => {
  favOnly = !favOnly;
  e.currentTarget.setAttribute("aria-pressed", favOnly ? "true" : "false");
  render();
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
load();
</script>
</body>
</html>
